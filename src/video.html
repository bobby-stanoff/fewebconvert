<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor - MediaTools</title>
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/video.css">
</head>

<body>

    <nav class="nav-header">
        <a href="./index.html" class="logo">MediaTools</a>
        <span>Video Processor</span>
    </nav>

    <main class="container workspace">

        <section class="preview-panel">
            <div id="drop-zone" class="drop-zone">
                <div class="icon">📂</div>
                <h3>Click or Drag Video Here</h3>
                <p class="text-muted">Supports MP4, MOV, WEBM</p>
                <input type="file" id="file-input" hidden accept="video/*">
            </div>

            <div id="video-wrapper" class="video-wrapper hidden">
                <video id="main-video" controls></video>
                <div class="file-info">
                    <span id="filename">video.mp4</span>
                    <button id="remove-file-btn" class="btn-text">Remove</button>
                </div>
            </div>
        </section>

        <section class="controls-panel">

            <div class="form-group">
                <h3>Target Format</h3>
                <select id="format-select">
                    <option value="mp4">MP4</option>
                    <option value="webm">WEBM</option>
                    <option value="gif">GIF</option>
                    <option value="mp3">MP3</option>
                </select>
            </div>

            <div class="form-group">
                <h3>Compression</h3>
                <label>Quality: <span id="quality-val">Medium</span></label>
                <input type="range" id="compression-slider" min="1" max="3" step="1" value="2">
            </div>

            <div class="form-group">
                <h3>Trim video(seconds)</h3>
                <div class="time-inputs">
                    <div>
              <label>Start</label>
              <input type="number" id="trim-start" value="0" min="0">
            </div>
            <div>
              <label>End</label>
              <input type="number" id="trim-end" value="10" min="0">
            </div>
                </div>
                <p class="text-small text-muted">Use the video player to find timestamps.</p>
            </div>

            <div class="action-area">
                <button id="process-btn" class="btn full-width" disabled>Start Processing</button>
            </div>

        </section>
    </main>

    <script type="module" src="./video.ts"></script>
</body>

</html>
